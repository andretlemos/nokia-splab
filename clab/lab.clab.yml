name: sros-splab
prefix: ""

mgmt:
  network: sros-splab-network
  ipv4-subnet: 10.10.0.0/16

topology:
  groups:
    nokia_srsim:
      kind: nokia_srsim
      image: srsim:26.3.R2
      license: ./SR_SIM_license.txt
      type: sr-1

    vm:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool

    cisco:
      kind: cisco_iol
      image: ghcr.io/autonetops/autonetops_labs/cisco_iol

  nodes:
    p1: { group: nokia_srsim, mgmt-ipv4: 10.10.10.1 }
    p2: { group: nokia_srsim, mgmt-ipv4: 10.10.10.2 }
    p3: { group: nokia_srsim, mgmt-ipv4: 10.10.10.3 }
    p4: { group: nokia_srsim, mgmt-ipv4: 10.10.10.4 }

    pe1: { group: nokia_srsim, mgmt-ipv4: 10.10.11.1 }
    pe2: { group: nokia_srsim, mgmt-ipv4: 10.10.11.2 }
    pe3: { group: nokia_srsim, mgmt-ipv4: 10.10.11.3 }
    pe4: { group: nokia_srsim, mgmt-ipv4: 10.10.11.4 }

    as1: { group: cisco, mgmt-ipv4: 10.10.1.1, startup-config: ./configs/as1.eos }
    as2: { group: cisco, mgmt-ipv4: 10.10.2.2, startup-config: ./configs/as2.eos }
    as3: { group: cisco, mgmt-ipv4: 10.10.3.3, startup-config: ./configs/as3.eos }    
    as4: { group: cisco, mgmt-ipv4: 10.10.4.4, startup-config: ./configs/as4.eos }

    client1:
      kind: linux
      group: vm
      exec:
        - ip address add 172.21.10.60/24 dev eth1
        - ip route del default
        - ip route add 0.0.0.0/0 via 172.21.10.1 dev eth1

    client2:
      kind: linux
      group: vm
      exec:
        - ip address add 172.21.20.60/24 dev eth1
        - ip route del default
        - ip route add 0.0.0.0/0 via 172.21.20.1 dev eth1

